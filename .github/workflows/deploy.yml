name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  # Redeploy daily so the saved GitHub contribution chart stays current.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Save the contribution chart into the build so visitors load it from
      # this site instead of the slow third-party service. The page falls back
      # to the live chart if this download fails.
      - name: Download GitHub contribution chart
        run: curl -fsSL --retry 3 --max-time 30 https://ghchart.rshah.org/2da44e/untreu2 -o public/github-chart.svg || echo "Chart download failed; the page will use the live chart."

      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: floyd-7d3a5
          channelId: live
