name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Redeploy daily so the saved GitHub contribution chart stays current.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Save the contribution chart into the build so visitors load it from
      # this site instead of the slow third-party service. The page falls back
      # to the live chart if this download fails.
      - name: Download GitHub contribution chart
        run: curl -fsSL --retry 3 --max-time 30 https://ghchart.rshah.org/2da44e/untreu2 -o public/github-chart.svg || echo "Chart download failed; the page will use the live chart."

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
